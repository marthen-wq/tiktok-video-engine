name: "Spike S1 - TTS comparison"

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install google-genai soundfile numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro

      - name: Gemini TTS samples
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python spikes/tts_spike.py gemini

      - name: Kokoro samples
        run: python spikes/tts_spike.py kokoro

      - uses: actions/upload-artifact@v4
        with:
          name: tts-samples
          path: spike_out/*.wav
          retention-days: 7
