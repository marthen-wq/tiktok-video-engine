name: "Auto TikTok Shorts Video Generator"

on:
  repository_dispatch:
    types: [generate-video]
  workflow_dispatch:
    inputs:
      quote_override:
        description: 'Teks Quote (Opsional, kosongkan untuk ambil dari Google Sheet)'
        required: false
        default: ''

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-montserrat

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Generation Engine
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          OMNIROUTE_URL: ${{ secrets.OMNIROUTE_URL }}
          OMNIROUTE_KEY: ${{ secrets.OMNIROUTE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUOTE_INPUT: ${{ github.event.inputs.quote_override }}
        run: |
          python generator.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-shorts-video
          path: output/*.mp4
          retention-days: 7
